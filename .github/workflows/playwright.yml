name: 🎭 Playwright Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: test (${{ matrix.project }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
            artifact: chromium
          - project: firefox
            browser: firefox
            artifact: firefox
          - project: webkit
            browser: webkit
            artifact: webkit
          - project: "Mobile Chrome"
            browser: chromium
            artifact: mobile-chrome
          - project: "Mobile Safari"
            browser: webkit
            artifact: mobile-safari

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SHA }}
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 🐣 Setup mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: bun

      - name: 📦 Install dependencies
        run: bun i

      - name: 🧩 Build app
        working-directory: "@caravan-kidstec/web"
        run: bun run build

      - name: 🎭 Install Playwright Browsers
        working-directory: "@caravan-kidstec/web"
        run: bun playwright install --with-deps ${{ matrix.browser }}

      - name: 🧪 Run Playwright tests
        working-directory: "@caravan-kidstec/web"
        run: bun --bun playwright test --project="${{ matrix.project }}"

      - name: 🆙 Upload Test Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.artifact }}
          path: "@caravan-kidstec/web/playwright-report/"
          retention-days: 30
