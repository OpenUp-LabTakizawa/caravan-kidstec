name: 🧪 Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      is_success: ${{ steps.test.outputs.is_success }}
      test_log: ${{ steps.test.outputs.test_log }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🐣 Setup mise
        uses: jdx/mise-action@v4.3.0
        with:
          install_args: bun

      - name: 📦 Install dependencies
        run: bun i

      - name: 🧪 Test app
        id: test
        env:
          FORCE_COLOR: 0
        run: |
          STATUS=0
          bun test:unit > test.log 2>&1 || STATUS=$?
          cat test.log
          if [ "$STATUS" -ne 0 ]; then
            echo "is_success=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_success=true" >> "$GITHUB_OUTPUT"
          fi
          UUID=$(uuidgen)
          {
            echo "test_log<<EOF_$UUID"
            # `bun --filter` prefixes every line with `<package> <script>: `,
            # which the patterns below are anchored against.
            awk '
              { sub(/^@caravan-kidstec\/web test:unit: /, "") }
              /^::group::/ { sub(/^::group::/, ""); block = $0 "\n"; grouped = 1; failed = 0; next }
              /^::endgroup::/ { if (failed) printf "%s", block; grouped = 0; next }
              /^::error/ { next }
              grouped { if ($0 !~ /^\(pass\)/) block = block $0 "\n"; if ($0 ~ /^\(fail\)/) failed = 1; next }
              !/^\(pass\)/ { print }
            ' test.log | cat -s
            echo "EOF_$UUID"
          } >> "$GITHUB_OUTPUT"

      - name: 💔 Fail if test failed
        if: steps.test.outputs.is_success == 'false'
        run: exit 1

  upload:
    runs-on: ubuntu-latest
    needs: test
    if: (success() || failure()) && github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/upload-pr-comment
        with:
          is_success: ${{ needs.test.outputs.is_success }}
          success_title: >-
            Test Passed
          success_body: >-
            Failed tests were fixed.
          failure_title: >-
            Test Failed
          failure_body: >-
            @${{ github.actor }}, your commit ${{ github.event.pull_request.head.sha }} failed the test.


            <details>

            <summary><strong>Test Log</strong></summary>


            ```shell

            ${{ needs.test.outputs.test_log }}

            ```


            </details>


            👀[View in Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          workflow_file: test.yml
